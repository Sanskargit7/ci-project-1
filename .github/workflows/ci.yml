name: Running the CI for testing the hello world     
on: 
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - ci-branch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run AI tool tests
        run: npm test
