name: Running the CI for testing the hello world     
on: 
  push:
    branches:
      - ci-branch
  pull_request:
    branches:
      - ci-branch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "18"

      - name: Install dependencies
        run: npm install

      - name: Run AI tool tests with report
        run: npm run test:report

      - name: Upload test report artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-report
          path: test-results/report.json
          retention-days: 7
